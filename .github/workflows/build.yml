name: Build Ryn APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ekstrak ryn-app.zip
        run: |
          mkdir -p project
          unzip -q ryn-app.zip -d project

      - name: Build APK
        run: |
          cd project/ryn-app
          gradle assembleDebug --no-daemon

      - name: Kumpulkan APK
        run: |
          mkdir -p out
          cp project/ryn-app/app/build/outputs/apk/debug/app-debug.apk out/Ryn-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ryn-APK
          path: out/Ryn-release.apk
